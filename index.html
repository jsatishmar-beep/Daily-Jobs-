<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SKJ Daily Work Diary</title>
<meta name="apple-mobile-web-app-title" content="SKJ Diary">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef2ff;--card:#fff;--tx:#1e1b4b;--mut:#64748b;--ac:#4f46e5;--ok:#16a34a;--wa:#ea580c;--pk:#db2777;--bd:#dfe5fb;--g1:#4f46e5;--g2:#06b6d4;--sh:0 2px 10px rgba(30,27,75,.08);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1222;--card:#1a2038;--tx:#e8ecff;--mut:#9aa6c7;--ac:#818cf8;--ok:#4ade80;--wa:#fb923c;--pk:#f472b6;--bd:#2b3356;--g1:#4338ca;--g2:#0e7490;--sh:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1222;--card:#1a2038;--tx:#e8ecff;--mut:#9aa6c7;--ac:#818cf8;--ok:#4ade80;--wa:#fb923c;--pk:#f472b6;--bd:#2b3356;--g1:#4338ca;--g2:#0e7490;--sh:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hdr{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#10b981);color:#fff;border-radius:0 0 22px 22px;padding:14px 14px 16px;margin:0 -14px 14px;box-shadow:0 6px 18px rgba(79,70,229,.3)}
.ht{display:flex;justify-content:space-between;align-items:center}
.ht h1{font-size:17px;margin:0}.ht span{font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px}
.date{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.date b{font-size:15px;text-align:center}
.nav{width:38px;height:34px;font-size:22px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff}
.pg{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.add input{width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.add input:focus{outline:0;border-color:var(--ac)}
.arow{display:flex;align-items:center;gap:8px}.arow .sp{flex:1;display:flex;align-items:center;gap:6px}
.pri{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.gh{background:var(--bg);border:1px solid var(--bd);padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px}
.job{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--jc);border-radius:14px;box-shadow:var(--sh)}
.job.p{--jc:var(--wa)}.job.cf{--jc:var(--pk)}.job.done{--jc:var(--ok)}
.chk{width:34px;height:34px;border-radius:50%;border:3px solid var(--jc);flex:none;display:grid;place-items:center;font-size:19px;color:#fff;margin-top:1px}
.job.done .chk{background:var(--ok)}
.job.done .tt{text-decoration:line-through;color:var(--mut)}
.t{flex:1;min-width:0;word-break:break-word}
.tag{font-size:12px;font-weight:700;color:var(--jc);margin-top:2px}
.pr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut)}
.ph img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:2px solid var(--ac)}
.ph.a img{border-color:var(--ok)}
.ph.add{flex-direction:row;font-size:12px;background:var(--bg);border:1px dashed var(--ac);color:var(--ac);padding:8px 10px;border-radius:10px}
.x{color:var(--mut);font-size:22px;width:30px;flex:none}
.pic{display:flex;align-items:center;gap:2px;font-size:18px;padding:6px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);flex:none}
.pic small{font-size:11px;font-weight:800;color:var(--ac)}
.jn{font-size:13px;color:var(--mut);margin-top:6px;font-style:italic;white-space:pre-wrap;cursor:pointer}
.mb textarea{width:100%;min-height:90px;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.empty{color:var(--mut);text-align:center;padding:22px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:46%;background:var(--card);border:2px solid var(--ac);color:var(--ac);padding:10px;border-radius:12px;font-weight:700}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 14px rgba(30,27,75,.1);z-index:10}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:12px;font-weight:700;color:var(--mut)}
.bnav button span{font-size:21px}
.bnav button.on{color:var(--tc);box-shadow:inset 0 3px 0 var(--tc)}
.c1{--tc:#4f46e5}.c2{--tc:#16a34a}.c3{--tc:#ea580c}
.md{position:fixed;inset:0;background:rgba(10,12,30,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md[hidden]{display:none}
.mb{background:var(--card);border-radius:18px;padding:16px;max-width:440px;width:100%;max-height:92%;overflow:auto;text-align:center}
.mb h3{margin:0 0 6px}.mb p{margin:0 0 10px;color:var(--mut)}
.mb img{max-width:100%;max-height:55vh;border-radius:12px}
.mbt{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
</style>
<style id="rcss">
.rep h2{margin:0;color:var(--ac);font-size:20px}
.rd{color:var(--mut);font-size:14px;margin-bottom:6px}
.hd,.hp,.dh{font-weight:700;font-size:14px;padding:6px 10px;border-radius:10px;margin:14px 0 4px;color:#fff}
.hd{background:var(--ok)}.hp{background:var(--wa)}.dh{background:var(--ac)}.dh.up{background:var(--mut)}
.ri{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.rt{flex:1;word-break:break-word}
.pp{display:flex;gap:6px;flex:none}
.fg{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:var(--mut)}
.th{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.ri.w{flex-direction:column;align-items:flex-start;gap:6px}
.nt{font-size:13px;color:var(--mut);margin-top:2px;white-space:pre-wrap;font-style:italic}
.tm{font-size:12px;color:var(--mut);font-weight:600}
</style>
<style>
@media print{:root:root:root{--bg:#fff;--card:#fff;--tx:#1e1b4b;--mut:#64748b;--ac:#4f46e5;--ok:#16a34a;--wa:#ea580c;--bd:#dfe5fb}
.hdr,.bnav,.btns,#v1{display:none!important}.card{border:0;padding:0;box-shadow:none}body{background:#fff;padding:0}
.hd,.hp,.dh{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ri{break-inside:avoid}}
</style>
</head>
<body>
<div class="hdr">
  <div class="ht"><h1>📒 SKJ Daily Work Diary</h1><span id="sum"></span></div>
  <div class="date"><button class="nav" id="prev" aria-label="Previous">‹</button><b id="dl"></b><button class="nav" id="next" aria-label="Next">›</button></div>
  <div class="pg"><i id="pgb"></i></div>
</div>

<div id="v1">
  <div class="card add">
    <input type="text" id="ni" placeholder="New job for this day…" maxlength="120">
    <div class="arow">
      <button class="gh" id="bp">📷 Before photo</button>
      <span class="sp" id="bprev"></span>
      <button class="pri" id="addb">Add job</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="btns"><button id="bk">Backup data</button><button id="rst">Restore data</button></div>
  <input type="file" id="rf" hidden>
</div>

<div id="v2" hidden>
  <div class="card rep" id="rep"></div>
  <div class="btns">
    <button id="copy">Copy text</button>
    <button id="share">Share text</button>
    <button id="exp" class="wo">Export with photos</button>
    <button id="prn" class="wo">Print / PDF</button>
  </div>
</div>

<div class="md" id="md" hidden><div class="mb" id="mb"></div></div>
<input type="file" id="fi" accept="image/*" hidden>
<nav class="bnav">
  <button id="t1" class="c1 on"><span>📝</span>Jobs</button>
  <button id="t2" class="c2"><span>📅</span>Daily</button>
  <button id="t3" class="c3"><span>📊</span>Weekly</button>
</nav>

<script>
(function(){
var K='dailyJobsDiary.v2',S={jobs:[]};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}}
try{var r=localStorage.getItem(K);if(r){var q=JSON.parse(r);if(q&&q.jobs)S=q;}}catch(e){}
function today(){return iso(new Date());}
var cur=today(),tab=1,pend=null,newB=null,nid=null,$=function(i){return document.getElementById(i);};
function fmt(s){return pd(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}
function label(){return pd(cur).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'})+(cur===today()?' (Today)':'');}
function weekDays(){var d=pd(cur),off=(d.getDay()+6)%7,a=[];for(var i=0;i<7;i++)a.push(iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()-off+i)));return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function days(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function find(id){return S.jobs.filter(function(j){return j.id===id;})[0];}
/* photos: k='b' before, 'a' after (a = legacy key); full 900px + thumb 260px */
function pkey(id,k,z){return 'djdPhoto.'+id+'.'+(k==='b'?'b':'')+z;}
function getP(id,k,z){try{return localStorage.getItem(pkey(id,k,z))||'';}catch(e){return '';}}
function setP(id,k,f,t){try{localStorage.setItem(pkey(id,k,'f'),f);localStorage.setItem(pkey(id,k,'t'),t);return true;}catch(e){return false;}}
function delP(id,k){try{localStorage.removeItem(pkey(id,k,'f'));localStorage.removeItem(pkey(id,k,'t'));}catch(e){}}
function has(j,k){return k==='b'?!!j.before:!!j.photo;}
function setFlag(j,k,v){if(k==='b')j.before=v;else j.photo=v;}
function nm(k){return k==='b'?'Before':'After';}
function rs(img,max){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.7);}
var md=$('md'),mb=$('mb'),fi=$('fi');
function openM(h){nid=null;mb.innerHTML=h;md.hidden=false;}
function closeM(){nid=null;md.hidden=true;mb.innerHTML='';}
function pick(id,k){pend={id:id,k:k};fi.value='';fi.click();}
function saveNote(){var t=$('nt');if(nid&&t){var j=find(nid);if(j){j.note=t.value.trim();save();}}}
function askAfter(id,edit){var j=find(id);if(!j)return;
 openM('<h3>'+(edit?'Job comment':'Job closed ✓')+'</h3><p>'+(edit?esc(j.title):'Add a comment and the AFTER photo (optional)')+'</p><textarea id="nt" placeholder="What was done? Any remarks…">'+esc(j.note||'')+'</textarea><div class="mbt">'+(j.photo?'':'<button class="pri" data-a="pick" data-k="a" data-i="'+id+'">📷 After photo</button>')+'<button class="'+(j.photo?'pri':'gh')+'" data-a="save">Save</button></div>');nid=id;}
function showPhoto(id,k){var j=find(id);if(!j)return;
 var tabs=['b','a'].filter(function(x){return has(j,x);}).map(function(x){return '<button class="'+(x===k?'pri':'gh')+'" data-a="view" data-k="'+x+'" data-i="'+id+'">'+nm(x)+'</button>';}).join('');
 openM('<h3>'+esc(j.title)+'</h3><div class="mbt" style="margin:0 0 8px">'+tabs+'</div><img src="'+getP(id,k,'f')+'" alt="'+nm(k)+' photo"><div class="mbt"><button class="gh" data-a="pick" data-k="'+k+'" data-i="'+id+'">Replace</button><button class="gh" data-a="del" data-k="'+k+'" data-i="'+id+'">Remove</button><button class="pri" data-a="close">Close</button></div>');}
fi.onchange=function(){var f=fi.files[0],p=pend;if(!f||!p)return;
 var u=URL.createObjectURL(f),im=new Image();
 im.onload=function(){var F=rs(im,900),T=rs(im,360);URL.revokeObjectURL(u);
  if(p.id==='new'){newB={f:F,t:T};updPrev();closeM();return;}
  var j=find(p.id);if(j){if(setP(p.id,p.k,F,T)){setFlag(j,p.k,true);save();}else alert('Phone storage is full. Remove some old photos.');}
  closeM();render();};
 im.onerror=function(){alert('Could not read that photo.');};im.src=u;};
md.onclick=function(e){if(e.target===md){saveNote();closeM();render();return;}var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,id=b.dataset.i,k=b.dataset.k;
 if(a==='close'||a==='save'){saveNote();closeM();render();}
 else if(a==='fshare')doShare();
 else if(a==='fdl')doDl();
 else if(a==='view')showPhoto(id,k);
 else if(a==='pick'){saveNote();pick(id,k);}
 else if(a==='del'){var j=find(id);if(j){setFlag(j,k,false);delP(id,k);save();}closeM();render();}};
function updPrev(){$('bprev').innerHTML=newB?'<img class="th" style="width:44px;height:44px" src="'+newB.t+'" alt="Before"><button class="x" id="bx" aria-label="Remove before photo">×</button>':'';}
function visible(d){var t=today();return S.jobs.filter(function(j){return j.created<=d&&(!j.doneDate||j.doneDate>=d)&&(d<=t||j.created===d);});}
function doneOn(d){return S.jobs.filter(function(j){return j.doneDate===d;}).sort(function(a,b){return (a.doneTime||'')<(b.doneTime||'')?-1:1;});}
function pendingAsOf(d){return S.jobs.filter(function(j){return j.created<=d&&(!j.doneDate||j.doneDate>d);});}
/* builds [plain text, html] for daily ('d') or weekly ('w') report */
function build(mode){
 var w=mode==='w',t='',h='',T=today();
 function head(c,tx){t+='\n'+tx+'\n';h+='<div class="'+c+'">'+esc(tx)+'</div>';}
 function none(){t+='  – none\n';h+='<div class="ri"><div class="rt">– none</div></div>';}
 function ph(j){return ['b','a'].filter(function(k){return has(j,k);}).map(function(k){
  return w?'<span class="fg"><img class="th" src="'+getP(j.id,k,'t')+'" alt=""><span>'+nm(k)+'</span></span>':'<button class="pic" data-p="'+j.id+'" data-k="'+k+'" aria-label="'+nm(k)+' photo">🖼<small>'+(k==='b'?'B':'A')+'</small></button>';}).join('');}
 function row(j,txt,tm,nt){var p=ph(j),pp=p?'<div class="pp">'+p+'</div>':'';
  h+='<div class="ri'+(w?' w':'')+'"><div class="rt">'+txt+(tm?' <span class="tm">'+tm+'</span>':'')+(nt?'<div class="nt">'+esc(nt)+'</div>':'')+'</div>'+pp+'</div>';}
 function ptxt(j){return (j.before?' [before photo]':'')+(j.photo?' [after photo]':'');}
 function item(j){t+='  ✓ '+j.title+(j.doneTime?' ['+j.doneTime+']':'')+ptxt(j)+'\n'+(j.note?'      Note: '+j.note.replace(/\n/g,'\n      ')+'\n':'');row(j,'✓ '+esc(j.title),j.doneTime||'',j.note);}
 function pends(l,d){if(!l.length){none();return;}l.forEach(function(j){var n=days(j.created,d);
  t+='- '+j.title+(n>0?' (since '+fmt(j.created)+', '+n+'d)':'')+ptxt(j)+'\n';row(j,'• '+esc(j.title),n>0?'since '+fmt(j.created)+' · '+n+'d':'');});}
 if(!w){var dn=doneOn(cur),pe=pendingAsOf(cur),L=label().replace(' (Today)','');
  t='DAILY WORK REPORT\n'+L+'\n';h='<h2>Daily Work Report</h2><div class="rd">'+esc(L)+'</div>';
  head('hd','DONE ('+dn.length+')');dn.length?dn.forEach(item):none();
  head('hp','PENDING ('+pe.length+')');pends(pe,cur);
 }else{var wd=weekDays(),asOf=wd[6]<T?wd[6]:T,tot=0,R=fmt(wd[0])+' – '+fmt(wd[6]);
  t='WEEKLY WORK REPORT\n'+R+'\n';h='<h2>Weekly Work Report</h2><div class="rd">'+esc(R)+'</div>';
  wd.forEach(function(d){if(d>T){head('dh up',fmt(d)+' — upcoming');return;}
   var x=doneOn(d);tot+=x.length;head('dh',fmt(d)+' — '+x.length+' done');x.length?x.forEach(item):none();});
  head('hd','TOTAL DONE: '+tot);
  var p2=pendingAsOf(asOf);head('hp','PENDING – CARRIED FORWARD ('+p2.length+')');pends(p2,asOf);}
 return [t,h];
}
function txt(){return build(tab===3?'w':'d')[0];}
function chip(j,k){return '<button class="ph '+k+'" data-p="'+j.id+'" data-k="'+k+'" aria-label="'+nm(k)+' photo"><img src="'+getP(j.id,k,'t')+'" alt=""><span>'+nm(k)+'</span></button>';}
function render(){
 var w=weekDays();$('dl').textContent=tab===3?'Week: '+fmt(w[0])+' – '+fmt(w[6]):label();
 var js=visible(cur),dn=js.filter(function(j){return j.doneDate===cur;}),pe=js.filter(function(j){return j.doneDate!==cur;});
 $('sum').textContent=dn.length+' / '+js.length+' done';$('pgb').style.width=(js.length?Math.round(dn.length*100/js.length):0)+'%';
 var L=$('list');
 if(!js.length)L.innerHTML='<div class="card empty">No jobs for this day.<br>Add one above ☝️</div>';
 else L.innerHTML=pe.concat(dn).map(function(j){var dd=j.doneDate===cur,cf=!dd&&j.created<cur,ps='';
  if(j.before)ps+=chip(j,'b');if(j.photo&&dd)ps+=chip(j,'a');
  if(!j.before&&!dd)ps+='<button class="ph add" data-c="'+j.id+'" data-k="b">＋ 📷 Before</button>';
  if(dd&&!j.photo)ps+='<button class="ph add" data-c="'+j.id+'" data-k="a">＋ 📷 After</button>';
  if(dd&&!j.note)ps+='<button class="ph add" data-n="'+j.id+'">＋ 📝 Comment</button>';
  return '<div class="job '+(dd?'done':cf?'cf':'p')+'"><button class="chk" data-d="'+j.id+'" aria-label="Toggle done">'+(dd?'✓':'')+'</button>'+
  '<div class="t"><div class="tt">'+esc(j.title)+'</div><div class="tag">'+(dd?'Done'+(j.doneTime?' '+j.doneTime:''):cf?'Carried forward from '+fmt(j.created):'Pending')+'</div>'+(dd&&j.note?'<div class="jn" data-n="'+j.id+'">'+esc(j.note)+'</div>':'')+'<div class="pr">'+ps+'</div></div>'+
  '<button class="x" data-x="'+j.id+'" aria-label="Delete job">×</button></div>';}).join('');
 $('rep').innerHTML=tab===1?'':build(tab===3?'w':'d')[1];
 $('v1').hidden=tab!==1;$('v2').hidden=tab===1;
 [].forEach.call(document.querySelectorAll('.wo'),function(b){b.hidden=tab!==3;});
 [1,2,3].forEach(function(n){$('t'+n).className='c'+n+(tab===n?' on':'');});
}
function shift(n){var d=pd(cur);cur=iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));render();}
function add(){var i=$('ni'),v=i.value.trim();if(!v)return;
 var j={id:uid(),title:v,created:cur,doneDate:null,doneTime:''};
 if(newB&&setP(j.id,'b',newB.f,newB.t))j.before=true;
 S.jobs.push(j);newB=null;updPrev();i.value='';save();render();}
$('addb').onclick=add;
$('ni').onkeydown=function(e){if(e.key==='Enter')add();};
$('bp').onclick=function(){pick('new','b');};
$('bprev').onclick=function(e){if(e.target.id==='bx'){newB=null;updPrev();}};
$('prev').onclick=function(){shift(tab===3?-7:-1);};
$('next').onclick=function(){shift(tab===3?7:1);};
[1,2,3].forEach(function(n){$('t'+n).onclick=function(){tab=n;render();window.scrollTo(0,0);};});
$('list').onclick=function(e){
 var b=e.target.closest('button,.jn');if(!b)return;
 if(b.dataset.d){var j=find(b.dataset.d);if(!j)return;
  if(j.doneDate===cur){j.doneDate=null;j.doneTime='';save();render();}
  else{j.doneDate=cur;j.doneTime=cur===today()?nowT():'';save();render();askAfter(j.id);}}
 else if(b.dataset.n)askAfter(b.dataset.n,true);
 else if(b.dataset.p)showPhoto(b.dataset.p,b.dataset.k);
 else if(b.dataset.c)pick(b.dataset.c,b.dataset.k);
 else if(b.dataset.x){if(confirm('Delete this job?')){var id=b.dataset.x;S.jobs=S.jobs.filter(function(x){return x.id!==id;});delP(id,'a');delP(id,'b');save();render();}}
};
$('rep').onclick=function(e){var b=e.target.closest('button');if(b&&b.dataset.p)showPhoto(b.dataset.p,b.dataset.k);};
$('copy').onclick=function(){
 var t=txt(),btn=this;
 function ok(){btn.textContent='Copied ✓';setTimeout(function(){btn.textContent='Copy text';},1500);}
 function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(a);}
 try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}
};
$('share').onclick=function(){var t=txt();try{if(navigator.share){navigator.share({text:t});return;}}catch(e){}$('copy').click();};
var pf=null;
function msg(t){var p=$('fi2');if(p){p.textContent=t;p.style.color='var(--ok)';p.style.fontWeight='700';}}
function offerFile(s,name,mime,title,info){pf={s:s,name:name,mime:mime,title:title};
 openM('<h3>'+esc(title)+' ready</h3><p id="fi2">'+esc(info)+'</p><div class="mbt"><button class="pri" data-a="fshare">📤 Share / Save to Drive</button><button class="gh" data-a="fdl">⬇ Download</button><button class="gh" data-a="close">Close</button></div>');}
function doShare(){if(!pf)return;
 try{var f=new File([pf.s],pf.name,{type:pf.mime==='application/json'?'text/plain':pf.mime});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:pf.title}).then(function(){msg('Shared ✓');}).catch(function(e){if(!e||e.name!=='AbortError')msg('Share failed. Tap Download instead.');});return;}}catch(e){}
 msg('Sharing is not available here. Tap Download instead.');}
function doDl(){if(!pf)return;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pf.s],{type:pf.mime}));a.download=pf.name;document.body.appendChild(a);a.click();document.body.removeChild(a);
 msg('Downloaded ✓ Look in your Downloads folder for '+pf.name);}
$('exp').onclick=function(){
 var doc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Work Report</title><style>:root{--tx:#1e1b4b;--mut:#64748b;--ac:#4f46e5;--ok:#16a34a;--wa:#ea580c;--bd:#dfe5fb}body{font:16px/1.4 system-ui,sans-serif;color:#1e1b4b;background:#fff;max-width:680px;margin:0 auto;padding:16px}.hd,.hp,.dh{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ri{break-inside:avoid}'+$('rcss').textContent.replace(/\.rep h2/,'h2')+'</style></head><body>'+build('w')[1]+'</body></html>';
 offerFile(doc,'Weekly_Work_Report_'+weekDays()[0]+'.html','text/html','Weekly report','Includes the photos. Choose how to save it.');};
$('prn').onclick=function(){window.print();};
$('bk').onclick=function(){
 var o={v:1,k:{}};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k===K||k.indexOf('djdPhoto.')===0)o.k[k]=localStorage.getItem(k);}}catch(e){}
 var nj=0,np=0,str=JSON.stringify(o);try{nj=(JSON.parse(o.k[K]||'{"jobs":[]}').jobs||[]).length;}catch(e){}
 Object.keys(o.k).forEach(function(k){if(/\.(b)?f$/.test(k))np++;});
 if(!nj){openM('<h3>Nothing to back up</h3><p>This app has no jobs yet.</p><div class="mbt"><button class="pri" data-a="close">OK</button></div>');return;}
 offerFile(str,'Daily_Jobs_Backup_'+today()+'.json','application/json','Backup',nj+' jobs, '+np+' photos ('+Math.round(str.length/1024)+' KB). Choose how to save it.');};
$('rst').onclick=function(){var rf=$('rf');rf.value='';rf.click();};
$('rf').onchange=function(){var rf=this,f=rf.files[0];if(!f)return;var fr=new FileReader();
 fr.onload=function(){try{var o=JSON.parse(fr.result),inc=JSON.parse(o.k[K]||'{"jobs":[]}'),have={};
  S.jobs.forEach(function(j){have[j.id]=1;});inc.jobs.forEach(function(j){if(!have[j.id])S.jobs.push(j);});
  Object.keys(o.k).forEach(function(k){if(k.indexOf('djdPhoto.')===0){try{localStorage.setItem(k,o.k[k]);}catch(e){}}});
  save();render();alert('Backup restored.');}catch(e){alert('That is not a valid backup file.');}};
 fr.readAsText(f);};
render();
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
